<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enhanced German Reader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tooltip {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: 4px;
      background: #1f2937;
      color: white;
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      white-space: nowrap;
      z-index: 50;
      pointer-events: none;
    }
    .highlighted {
      background-color: #fef08a;
      border-radius: 0.25rem;
      font-weight: bold;
      position: relative;
    }
    #selectionTooltip {
      position: absolute;
      background: #1f2937;
      color: white;
      font-size: 0.8rem;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      white-space: nowrap;
      z-index: 100;
      display: none;
    }
    #output {
      white-space: pre-wrap;
    }
    .speaking {
      background-color: #bbf7d0 !important;
    }
    .loading {
      opacity: 0.7;
      position: relative;
    }
    .loading::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      margin: -8px 0 0 -8px;
      border: 2px solid #3b82f6;
      border-radius: 50%;
      border-right-color: transparent;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">
  <div class="w-full max-w-3xl">
    <h1 class="text-2xl font-bold mb-2 text-blue-800">Enhanced German Reader</h1>
    <p class="text-gray-600 mb-4">Click on any German word to see its translation and hear pronunciation. Highlight multiple words for phrase translation.</p>

    <div class="bg-white p-4 rounded-lg shadow-sm mb-6">
      <textarea
        id="input"
        placeholder="Guten Morgen! Wie geht es dir heute? Ich möchte nach Hause fahren."
        class="w-full h-40 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
      ></textarea>

      <div class="flex justify-between items-center mt-3">
        <button
          id="processBtn"
          class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 flex items-center"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
          </svg>
          Process Text
        </button>
        
        <div class="flex items-center">
          <button
            id="stopSpeechBtn"
            class="px-3 py-1 bg-red-500 text-white rounded-lg text-sm mr-2 flex items-center"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd" />
            </svg>
            Stop Speech
          </button>
          
          <div class="text-sm text-gray-600">
            <span id="status">Ready</span>
          </div>
        </div>
      </div>
    </div>

    <div
      id="output"
      class="w-full p-6 bg-white border rounded-lg shadow-sm leading-8 min-h-[200px]"
    ></div>

    <div id="selectionTooltip"></div>
  </div>

  <script>
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const processBtn = document.getElementById("processBtn");
    const stopSpeechBtn = document.getElementById("stopSpeechBtn");
    const selectionTooltip = document.getElementById("selectionTooltip");
    const statusEl = document.getElementById("status");
    
    let currentUtterance = null;
    let speechSynth = window.speechSynthesis;

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function tokenize(text) {
      return text.split(/(\s+|[^A-Za-zÄÖÜäöüß]+)/).filter(Boolean);
    }

    // LibreTranslate proxy function
    async function translate(text) {
      setStatus("Translating...");
      try {
        // Using a CORS proxy to access LibreTranslate
        const proxyUrl = 'https://corsproxy.io/?';
        const translateUrl = 'https://libretranslate.de/translate';
        
        const response = await fetch(proxyUrl + encodeURIComponent(translateUrl), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            q: text,
            source: 'de',
            target: 'en',
            format: 'text'
          })
        });

        if (!response.ok) {
          throw new Error(`Translation failed: ${response.status}`);
        }

        const data = await response.json();
        setStatus("Ready");
        return data.translatedText || "(translation not available)";
      } catch (error) {
        console.error("Translation error:", error);
        setStatus("Translation error");
        return "(translation error)";
      }
    }

    function speak(text, lang = "de-DE") {
      // Cancel any ongoing speech
      if (currentUtterance) {
        speechSynth.cancel();
      }
      
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      
      // Store the current utterance
      currentUtterance = utter;
      
      // Update status
      setStatus("Speaking...");
      
      // Clear the reference when speech is done
      utter.onend = function() {
        if (currentUtterance === utter) {
          currentUtterance = null;
          setStatus("Ready");
        }
      };
      
      utter.onerror = function() {
        setStatus("Speech error");
      };
      
      speechSynth.speak(utter);
    }

    function stopSpeech() {
      if (speechSynth.speaking) {
        speechSynth.cancel();
        setStatus("Speech stopped");
        // Remove speaking highlights
        document.querySelectorAll('.speaking').forEach(el => {
          el.classList.remove('speaking');
        });
      }
    }

    async function onWordClick(word, span) {
      const alreadyHighlighted = span.classList.contains("highlighted");

      if (alreadyHighlighted) {
        // Highlight while speaking
        span.classList.add('speaking');
        
        // Speak the word
        speak(word, "de-DE");
        
        // Remove speaking highlight when done
        setTimeout(() => {
          if (span.classList.contains('speaking')) {
            span.classList.remove('speaking');
          }
        }, 1000);
        
        return;
      }

      // Add loading indicator
      span.classList.add('loading');
      
      // Speak and translate
      speak(word, "de-DE");
      const translated = await translate(word);

      // Remove loading indicator
      span.classList.remove('loading');
      
      // Add highlight
      span.classList.add("highlighted", "speaking");

      // Add tooltip above the word
      const tip = document.createElement("div");
      tip.className = "tooltip";
      tip.textContent = translated;
      span.appendChild(tip);
      
      // Remove speaking highlight after a delay
      setTimeout(() => {
        span.classList.remove("speaking");
      }, 1000);
    }

    async function handleSelection() {
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      
      const text = sel.toString().trim();
      if (text.length < 2) return;

      // Only allow selections inside the output area
      if (!output.contains(sel.anchorNode)) {
        selectionTooltip.style.display = "none";
        return;
      }

      // Highlight the selection temporarily
      const range = sel.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      
      // Speak the selection
      speak(text, "de-DE");
      
      // Show loading in tooltip
      selectionTooltip.textContent = "Translating...";
      selectionTooltip.style.left = rect.left + rect.width / 2 + window.scrollX + "px";
      selectionTooltip.style.top = rect.top + window.scrollY - 40 + "px";
      selectionTooltip.style.display = "block";

      // Translate the selection
      const translated = await translate(text);

      // Update tooltip with translation
      selectionTooltip.textContent = translated;
      
      // Auto-hide after 5 sec
      setTimeout(() => {
        selectionTooltip.style.display = "none";
      }, 5000);
    }

    processBtn.addEventListener("click", () => {
      output.innerHTML = "";
      const tokens = tokenize(input.value);

      tokens.forEach((tok) => {
        if (/^[A-Za-zÄÖÜäöüß]+$/.test(tok)) {
          const span = document.createElement("span");
          span.textContent = tok;
          span.className = "relative cursor-pointer hover:bg-yellow-100 rounded px-1 mx-0.5";
          span.addEventListener("click", () => onWordClick(tok, span));
          output.appendChild(span);
        } else {
          output.appendChild(document.createTextNode(tok));
        }
      });
      
      setStatus("Text processed");
    });

    stopSpeechBtn.addEventListener("click", stopSpeech);

    // Listen for text selection
    document.addEventListener("mouseup", () => {
      setTimeout(handleSelection, 50);
    });

    // Initialize with some German text
    input.value = "Guten Morgen! Wie geht es dir heute? Ich möchte nach Hause fahren. Das Wetter ist sehr schön.";
    processBtn.click();
  </script>
</body>
</html>
