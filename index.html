<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>German Learning Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>

    <style>
        /* keep same styles as before ... (tooltips, flashcards, etc.) */
        .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 4px;
            background: #1f2937;
            color: white;
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            z-index: 50;
            max-width: 300px;
        }

        .highlighted {
            background-color: #fef08a;
            border-radius: 0.25rem;
            font-weight: bold;
        }

        #selectionTooltip {
            position: absolute;
            background: #1f2937;
            color: white;
            font-size: 0.8rem;
            padding: 0.5rem;
            border-radius: 0.25rem;
            z-index: 100;
            display: none;
            max-width: 300px;
        }

        #output {
            white-space: pre-wrap;
            user-select: text;
        }

        .speaking {
            background-color: #bbf7d0 !important;
        }

        .loading {
            opacity: 0.7;
            position: relative;
        }

        .loading::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            margin: -8px 0 0 -8px;
            border: 2px solid #3b82f6;
            border-radius: 50%;
            border-right-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .selection-highlight {
            background-color: rgba(79, 70, 229, 0.2);
            position: absolute;
            pointer-events: none;
            z-index: 99;
        }

        .flashcard {
            perspective: 1000px;
            min-height: 80px;
        }

        .flashcard-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front,
        .flashcard-back {
            backface-visibility: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .flashcard-back {
            transform: rotateY(180deg);
        }

        .progress-bar {
            transition: width 0.3s ease;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen p-6">

    <!-- Tabs -->
    <div class="max-w-4xl mx-auto mb-6 flex justify-center space-x-4">
        <button id="tab-vocab" class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700">Vocabulary
            Tool</button>
        <button id="tab-flash"
            class="px-4 py-2 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700">Flashcards</button>
    </div>

    <!-- Vocabulary Tool -->
    <section id="vocab-tool" class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold mb-2 text-blue-800">German Vocabulary Tool</h1>
        <p class="text-gray-600 mb-4">Click on any German word to see its translation and hear pronunciation.</p>
        <div class="bg-white p-4 rounded-lg shadow-sm mb-6">
            <textarea id="input"
                class="w-full h-40 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">Guten Morgen! Wie geht es dir heute?</textarea>
            <div class="flex justify-between items-center mt-3">
                <button id="processBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow">Process Text</button>
                <button id="stopSpeechBtn" class="px-3 py-1 bg-red-500 text-white rounded-lg text-sm">Stop
                    Speech</button>
            </div>
        </div>
        <div class="flex justify-center">
            <span id="status" class="text-sm text-gray-600">Ready</span>
        </div>
        <div id="output" class="w-full p-6 bg-white border rounded-lg shadow-sm leading-8 min-h-[200px]"></div>
        <div id="selectionTooltip"></div>
    </section>

    <!-- Flashcards Tool -->
    <section id="flashcard-tool" class="container mx-auto px-4 py-8 hidden">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-indigo-700 mb-2">German Flashcards</h1>
            <p class="text-gray-600">Master German vocabulary with interactive flashcards</p>
            <!-- Import/Export Flashcards JSON -->
            <div class="max-w-4xl mx-auto my-8 flex flex-col items-center space-y-2">
                <div class="flex space-x-2">
                    <button id="import-json-btn"
                        class="px-4 py-2 bg-green-600 text-white rounded-lg shadow hover:bg-green-700">
                        Import JSON
                    </button>
                    <button id="import-json-text-btn"
                        class="px-4 py-2 bg-yellow-600 text-white rounded-lg shadow hover:bg-yellow-700">
                        Load from Text
                    </button>
                    <button id="export-json-btn"
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700">
                        Export JSON
                    </button>
                </div>
                <input id="import-json-input" type="file" accept="application/json" class="hidden" />
                <textarea id="import-export-json-area" class="w-full max-w-lg p-2 border rounded text-sm mt-2" rows="3"
                    placeholder="Imported/Exported JSON will appear here"></textarea>
            </div>
            <div class="mt-6 flex justify-center">
                <div class="w-full max-w-md bg-white rounded-lg shadow p-4">
                    <div class="flex justify-between mb-1">
                        <span class="text-sm font-medium text-indigo-700">Progress</span>
                        <span id="progress-percentage" class="text-sm font-medium text-indigo-700">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="progress-bar bg-indigo-600 h-2.5 rounded-full" style="width: 0%">
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <!-- Flashcards Controls + Container -->
        <div class="mb-8 flex flex-col items-center space-y-4">
            <!-- Add Flashcards Popup Button + Modal -->
            <button id="open-add-flashcards-modal"
                class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition w-full max-w-md">
                + Add New Flashcards
            </button>
            <div id="add-flashcards-modal"
                class="fixed inset-0 w-full h-full bg-black bg-opacity-40 flex items-center justify-center z-50 hidden">
                <div class="w-full max-w-md bg-white rounded-lg shadow p-4 relative">
                    <button id="close-add-flashcards-modal"
                        class="absolute top-2 right-2 text-gray-500 hover:text-gray-700 text-xl">&times;</button>
                    <h3 class="text-lg font-medium text-indigo-700 mb-2">Add New Flashcards</h3>
                    <input id="list-name-input" type="text" class="w-full p-2 border rounded mb-2"
                        placeholder="List name (e.g. 'Food Vocabulary')">
                    <textarea id="new-flashcards-input" class="w-full h-40 p-2 border rounded mb-2"
                        placeholder="Enter German – English pairs"></textarea>
                    <button id="add-flashcards-btn"
                        class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition w-full">Add
                        Flashcards</button>
                </div>
            </div>

            <div class="flex space-x-4">
                <button id="shuffle-btn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg">Shuffle</button>
                <button id="reset-btn" class="px-4 py-2 bg-gray-600 text-white rounded-lg">Reset</button>
                <button id="show-original-btn" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Original
                    List</button>
                <button id="show-not-mastered-btn" class="px-4 py-2 bg-yellow-600 text-white rounded-lg">Not
                    Mastered</button>
            </div>
            <div id="custom-lists-container" class="flex flex-wrap justify-center gap-2"></div>
        </div>
        <div id="flashcards-container"
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mx-auto max-w-3xl"></div>
        </div>
        <div id="pagination-controls" class="mt-8 flex justify-center items-center space-x-4 hidden">
            <button id="prev-page-btn" class="px-4 py-2 bg-gray-600 text-white rounded-lg">Previous</button>
            <span id="page-info" class="text-gray-600 font-medium">Page 1 of 1</span>
            <button id="next-page-btn" class="px-4 py-2 bg-gray-600 text-white rounded-lg">Next</button>
        </div>
    </section>


    <script>
        // Import/Export JSON logic
        document.addEventListener('DOMContentLoaded', function () {
            (async function () {
                let customLists = JSON.parse(localStorage.getItem('customGermanLists') || '{}');
                if (!customLists || Object.keys(customLists).length === 0) {
                    try {
                        const res = await fetch('/data.json');
                        if (res.ok) {
                            const data = await res.json();
                            if (typeof data === 'object' && !Array.isArray(data) && Object.keys(data).length > 0) {
                                localStorage.setItem('customGermanLists', JSON.stringify(data));
                                // renderCustomListButtons();
                                // renderFlashcards();
                                location.reload();
                            }
                        }
                    } catch (e) {
                        // Ignore fetch errors
                    }
                }
            })();
            const importBtn = document.getElementById('import-json-btn');
            const importTextBtn = document.getElementById('import-json-text-btn');
            const exportBtn = document.getElementById('export-json-btn');
            const importInput = document.getElementById('import-json-input');
            const jsonArea = document.getElementById('import-export-json-area');

            // Export: Download all custom lists as JSON
            exportBtn.addEventListener('click', function () {
                const customLists = JSON.parse(localStorage.getItem('customGermanLists')) || {};
                const exportData = {};
                for (const [name, cards] of Object.entries(customLists)) {
                    exportData[name] = cards.map(c => ({
                        german: c.german,
                        english: c.english,
                        mastered: !!c.mastered
                    }));
                }
                const jsonStr = JSON.stringify(exportData, null, 2);
                jsonArea.value = jsonStr;
                // Download as file
                const blob = new Blob([jsonStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'german-flashcards.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            // Import: Open file dialog
            importBtn.addEventListener('click', function () {
                importInput.value = "";
                importInput.click();
            });

            // Handle file selection
            importInput.addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function (evt) {
                    try {
                        const data = JSON.parse(evt.target.result);
                        if (typeof data !== 'object' || Array.isArray(data)) throw new Error();
                        let customLists = JSON.parse(localStorage.getItem('customGermanLists')) || {};
                        let importedCount = 0;
                        for (const [name, cards] of Object.entries(data)) {
                            if (Array.isArray(cards) && cards.length && cards[0].german && cards[0].english) {
                                // Merge: If exists, append new cards not already present
                                if (!customLists[name]) {
                                    customLists[name] = [];
                                }
                                const existing = new Set(customLists[name].map(c => c.german + '|' + c.english));
                                cards.forEach(card => {
                                    const key = card.german + '|' + card.english;
                                    if (!existing.has(key)) {
                                        customLists[name].push({
                                            german: card.german,
                                            english: card.english,
                                            mastered: !!card.mastered
                                        });
                                        importedCount++;
                                    }
                                });
                            }
                        }
                        localStorage.setItem('customGermanLists', JSON.stringify(customLists));
                        jsonArea.value = evt.target.result;
                        location.reload();
                        // Show notification
                        const notif = document.createElement('div');
                        notif.textContent = `Imported ${importedCount} new flashcards.`;
                        notif.className = "fixed top-6 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-4 py-2 rounded shadow z-50";
                        document.body.appendChild(notif);
                        setTimeout(() => notif.remove(), 3500);
                    } catch {
                        jsonArea.value = "Invalid JSON format.";
                    }
                };
                reader.readAsText(file);
            });

            // Import from text area
            importTextBtn.addEventListener('click', function () {
                const text = jsonArea.value.trim();
                if (!text) {
                    jsonArea.value = "Paste JSON here first.";
                    return;
                }
                try {
                    const data = JSON.parse(text);
                    if (typeof data !== 'object' || Array.isArray(data)) throw new Error();
                    let customLists = JSON.parse(localStorage.getItem('customGermanLists')) || {};
                    let importedCount = 0;
                    for (const [name, cards] of Object.entries(data)) {
                        if (Array.isArray(cards) && cards.length && cards[0].german && cards[0].english) {
                            // Merge: If exists, append new cards not already present
                            if (!customLists[name]) {
                                customLists[name] = [];
                            }
                            const existing = new Set(customLists[name].map(c => c.german + '|' + c.english));
                            cards.forEach(card => {
                                const key = card.german + '|' + card.english;
                                if (!existing.has(key)) {
                                    customLists[name].push({
                                        german: card.german,
                                        english: card.english,
                                        mastered: !!card.mastered
                                    });
                                    importedCount++;
                                }
                            });
                        }
                    }
                    localStorage.setItem('customGermanLists', JSON.stringify(customLists));

                    location.reload();
                    // Show notification
                    const notif = document.createElement('div');
                    notif.textContent = `Imported ${importedCount} new flashcards from text.`;
                    notif.className = "fixed top-6 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-4 py-2 rounded shadow z-50";
                    document.body.appendChild(notif);
                    setTimeout(() => notif.remove(), 3500);
                } catch {
                    jsonArea.value = "Invalid JSON format.";
                }
            });
        });
    </script>

    </script>
    <!-- Toggle Script -->
    <script>
        const vocabTab = document.getElementById("tab-vocab");
        const vocabTool = document.getElementById("vocab-tool");
        const flashTab = document.getElementById("tab-flash");
        const flashTool = document.getElementById("flashcard-tool");

        vocabTab.addEventListener("click", () => {
            vocabTool.classList.remove("hidden");
            flashTool.classList.add("hidden");
            vocabTab.classList.add("bg-blue-700");
            flashTab.classList.remove("bg-indigo-700");
        });

        // Update URL query param when switching tabs
        function setQueryParam(key, value) {
            const url = new URL(window.location);
            url.searchParams.set(key, value);
            window.history.replaceState({}, '', url);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!vocabTab || !flashTab) return;
            vocabTab.addEventListener("click", () => {
                setQueryParam('page', 'vocab');
                vocabTool.classList.remove("hidden");
                flashTool.classList.add("hidden");
                vocabTab.classList.add("bg-blue-700");
                flashTab.classList.remove("bg-indigo-700");
            });

            flashTab.addEventListener("click", () => {
                setQueryParam('page', 'flashcards');
                flashTool.classList.remove("hidden");
                vocabTool.classList.add("hidden");
                flashTab.classList.add("bg-indigo-700");
                vocabTab.classList.remove("bg-blue-700");
            });

            // On page load, switch to tab based on query param
            const params = new URL(window.location).searchParams;
            if (params.get('page') === 'flashcards') {
                flashTab.click();
            } else {
                vocabTab.click();
            }
        });
    </script>

    <!-- Scripts -->
    <script>
        /* ==== Vocabulary Tool Script ==== */
        (() => {
            const input = document.getElementById("input");
            const output = document.getElementById("output");
            const processBtn = document.getElementById("processBtn");
            const stopSpeechBtn = document.getElementById("stopSpeechBtn");
            const selectionTooltip = document.getElementById("selectionTooltip");
            const statusEl = document.getElementById("status");

            let currentUtterance = null;
            let speechSynth = window.speechSynthesis;
            let selectionHighlight = null;

            function setStatus(message) {
                statusEl.textContent = message;
            }

            function tokenize(text) {
                return text.split(/(\s+|[^A-Za-zÄÖÜäöüß]+)/).filter(Boolean);
            }

            // Use a backend proxy for TTS requests (for Vercel deployment)
            async function speak(text, lang = "de") {
                setStatus("Loading audio...");
                if (lang === null || text === '') return;
                try {
                    const url = `/api/tts?text=${encodeURIComponent(text)}&lang=${lang}`;
                    const audio = new Audio(url);
                    audio.play();
                    audio.onplaying = () => setStatus("Speaking...");
                    audio.onended = () => setStatus("Ready");
                    audio.onerror = () => setStatus("Speech error");
                } catch {
                    setStatus("Speech error");
                }
            }

            function stopSpeech() {
                if (speechSynth.speaking) {
                    speechSynth.cancel();
                    setStatus("Speech stopped");
                    document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));
                }
            }

            function joinTranslationChunks(data) {
                if (!Array.isArray(data?.[0])) return "(error)";
                return data[0].map(chunk => chunk[0].replace(/\n/g, " ")).join(" ");
            }

            // Add language selector dropdown
            const langSelector = document.createElement('select');
            langSelector.id = "langSelector";
            langSelector.className = "ml-2 px-2 py-1 border rounded text-sm";
            langSelector.innerHTML = `
                <option value="en" selected>English</option>
                <option value="ar">Arabic</option>
            `;
            // Insert after the process button
            processBtn.parentNode.insertBefore(langSelector, processBtn.nextSibling);

            let selectedLang = "en";
            langSelector.addEventListener('change', () => {
                selectedLang = langSelector.value;
            });

            async function translate(text) {
                try {
                    const res = await fetch(
                        "https://translate.googleapis.com/translate_a/single?client=gtx&sl=de&tl=" +
                        encodeURIComponent(selectedLang) +
                        "&dt=t&q=" + encodeURIComponent(text)
                    );
                    const data = await res.json();
                    return joinTranslationChunks(data);
                } catch { return "(error)"; }
            }

            async function onWordClick(word, span) {
                console.log(`Clicked on word: ${word}`);
                if (span.classList.contains("highlighted")) {
                    console.log('.....Removing highlight');
                    span.classList.remove("highlighted");
                    span.querySelector(".tooltip")?.remove();
                    return;
                }
                span.classList.add('loading');
                speak(word);
                const translated = await translate(word);
                console.log(`Translated "${word}" to "${translated}"`);
                span.classList.remove('loading');
                span.classList.add("highlighted");
                const tip = document.createElement("div");
                tip.className = "tooltip";
                tip.textContent = translated;
                tip.style.whiteSpace = "nowrap";
                tip.style.textOverflow = "ellipsis";
                tip.style.overflow = "hidden";
                span.appendChild(tip);
            }

            function getSelectedWords() {
                const selection = window.getSelection();
                if (!selection.rangeCount || selection.toString().trim().length < 2) return null;
                const range = selection.getRangeAt(0);
                if (!output.contains(range.startContainer) && !output.contains(range.endContainer)) return null;
                return { text: selection.toString().trim(), range };
            }
            // Detect touch device
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

            async function handleSelection() {
                if (isTouchDevice) {
                    // On touch devices, use long-press to trigger translation and highlight
                    output.querySelectorAll("span").forEach(span => {
                        if (!span._touchHandlerAdded) {
                            let touchTimer = null;
                            span.addEventListener("touchstart", function (e) {
                                touchTimer = setTimeout(async () => {
                                    // Remove highlight from others
                                    output.querySelectorAll('.highlighted').forEach(s => {
                                        s.classList.remove('highlighted');
                                        s.querySelector('.tooltip')?.remove();
                                    });
                                    // Highlight this word
                                    span.classList.add('highlighted');
                                    // Remove old tooltip if any
                                    span.querySelector('.tooltip')?.remove();
                                    const word = span.textContent;
                                    speak(word);
                                    selectionTooltip.textContent = "Translating...";
                                    const rect = span.getBoundingClientRect();
                                    selectionTooltip.style.left = (rect.left + window.scrollX) + "px";
                                    selectionTooltip.style.top = (rect.top + window.scrollY - 10) + "px";
                                    selectionTooltip.style.display = "block";
                                    const translated = await translate(word);
                                    selectionTooltip.textContent = translated;
                                    selectionTooltip.style.top = (rect.top + window.scrollY - selectionTooltip.offsetHeight - 10) + "px";
                                    // Show tooltip as child of span for consistency
                                    let tip = document.createElement("div");
                                    tip.className = "tooltip";
                                    tip.textContent = translated;
                                    tip.style.whiteSpace = "nowrap";
                                    tip.style.textOverflow = "ellipsis";
                                    tip.style.overflow = "hidden";
                                    span.appendChild(tip);
                                    setTimeout(() => {
                                        selectionTooltip.style.display = "none";
                                        // Optionally remove highlight after a while
                                        // span.classList.remove('highlighted');
                                        // tip.remove();
                                    }, 4000);
                                }, 500); // long-press: 500ms
                            });
                            span.addEventListener("touchend", function () {
                                clearTimeout(touchTimer);
                            });
                            span._touchHandlerAdded = true;
                        }
                    });
                    // Hide selection highlight/tooltip if not using long-press
                    selectionTooltip.style.display = "none";
                    selectionHighlight?.remove();
                    selectionHighlight = null;
                    return;
                }
                // Desktop: original logic
                const selection = getSelectedWords();
                if (!selection) {
                    selectionTooltip.style.display = "none";
                    selectionHighlight?.remove();
                    selectionHighlight = null;
                    // Remove browser selection highlight
                    if (window.getSelection) window.getSelection().removeAllRanges();
                    return;
                }
                const rect = selection.range.getBoundingClientRect();
                if (!selectionHighlight) {
                    selectionHighlight = document.createElement('div');
                    selectionHighlight.className = 'selection-highlight';
                    document.body.appendChild(selectionHighlight);
                }
                selectionHighlight.style.width = rect.width + 'px';
                selectionHighlight.style.height = rect.height + 'px';
                selectionHighlight.style.left = (rect.left + window.scrollX) + 'px';
                selectionHighlight.style.top = (rect.top + window.scrollY) + 'px';
                try {
                    const sel = window.getSelection();
                    if (sel && sel.rangeCount) {
                        const spans = output.querySelectorAll("span");
                        spans.forEach(span => {
                            // containsNode(span, true) returns true if any part of the span is selected
                            if (sel.containsNode(span, true)) {
                                span.classList.add("highlighted");
                            }
                        });
                    }
                } catch (err) {
                    console.warn("Could not apply span highlights:", err);
                }
                // Remove browser selection highlight
                if (window.getSelection) window.getSelection().removeAllRanges();
                speak(selection.text);
                selectionTooltip.textContent = "Translating...";
                selectionTooltip.style.left = (rect.left + window.scrollX) + "px";
                selectionTooltip.style.top = (rect.top + window.scrollY - 10) + "px";
                selectionTooltip.style.display = "block";
                const translated = await translate(selection.text);
                selectionTooltip.textContent = translated;
                selectionTooltip.style.top = (rect.top + window.scrollY - selectionTooltip.offsetHeight - 10) + "px";

                setTimeout(() => {
                    selectionTooltip.style.display = "none";
                    selectionHighlight?.remove();
                    selectionHighlight = null;
                }, 10000);
            }

            processBtn.addEventListener("click", () => {
                output.innerHTML = "";
                tokenize(input.value).forEach((tok) => {
                    if (/^[A-Za-zÄÖÜäöüß]+$/.test(tok)) {
                        const span = document.createElement("span");
                        span.textContent = tok;
                        span.className = "relative cursor-pointer hover:bg-yellow-100 rounded px-1 mx-0.5";
                        span.addEventListener("click", () => onWordClick(tok, span));
                        output.appendChild(span);
                    } else { output.appendChild(document.createTextNode(tok)); }
                });
                setStatus("Text processed");
            });

            stopSpeechBtn.addEventListener("click", stopSpeech);
            output.addEventListener("click", () => setTimeout(handleSelection, 50));
            processBtn.click(); // auto-init

            /* ==== Add to Flashcard Button & Modal ==== */
            // Create the button
            const addToFlashBtn = document.createElement('button');
            addToFlashBtn.id = "addToFlashBtn";
            addToFlashBtn.className = "px-4 py-2 bg-yellow-500 text-white rounded-lg shadow";
            addToFlashBtn.textContent = "Add to Flashcards";
            // Insert before stopSpeechBtn
            stopSpeechBtn.parentNode.insertBefore(addToFlashBtn, stopSpeechBtn);

            // Modal HTML
            const modal = document.createElement('div');
            modal.id = "add-to-flash-modal";
            modal.className = "fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 hidden";
            modal.innerHTML = `
                <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md relative">
                    <button id="close-add-to-flash-modal" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700 text-xl">&times;</button>
                    <h3 class="text-lg font-bold text-indigo-700 mb-2">Add to Flashcards</h3>
                    <div id="selected-word-preview" class="mb-4 text-center text-lg font-semibold text-gray-800"></div>
                    <div class="mb-2">
                        <label class="block text-sm font-medium mb-1">Choose a list:</label>
                        <div id="flashcard-lists" class="flex flex-col gap-2"></div>
                    </div>
                    <div class="my-2 text-center text-gray-500">or</div>
                    <div class="mb-2">
                        <input id="new-list-name" type="text" class="w-full p-2 border rounded mb-1" placeholder="New list name">
                        <button id="create-new-list-btn" class="px-3 py-1 bg-green-600 text-white rounded">Create & Add</button>
                    </div>
                    <div id="add-flashcard-status" class="mt-2 text-sm text-center"></div>
                </div>
            `;
            document.body.appendChild(modal);

            let lastSelectedWord = null;
            let lastSelectedTranslation = null;

            // Helper: get selected word (from highlighted span)
            function getCurrentHighlightedWords() {
                const spans = output.querySelectorAll('.highlighted');
                console.log(spans.length)
                if (spans.length == 1) {
                    const results = Array.from(spans).map(span => {
                        const word = span.childNodes[0]?.textContent || span.textContent;
                        const tip = span.querySelector('.tooltip');
                        const translation = tip ? tip.textContent : '';
                        return { word, translation };
                    });

                    console.log("Current highlighted words:", results);
                    return results[0];
                }
                else {
                    const translated = document.getElementById('selectionTooltip').textContent || '';
                    const words = Array.from(spans).map(span => span.childNodes[0]?.textContent || span.textContent)
                    if (words.length <= 5 && translated) {
                        return { word: words.join(' '), translation: translated };
                    }
                    alert('Max 5 words')

                }
                return [];
            }


            // Show modal and populate lists
            function showAddToFlashModal(word, translation) {
                modal.classList.remove('hidden');
                document.getElementById('selected-word-preview').textContent = `"${word}" → "${translation}"`;
                const listsDiv = document.getElementById('flashcard-lists');
                const customLists = JSON.parse(localStorage.getItem('customGermanLists')) || {};
                listsDiv.innerHTML = '';
                Object.keys(customLists).forEach(listName => {
                    const btn = document.createElement('button');
                    btn.className = "px-3 py-1 bg-purple-600 text-white rounded hover:bg-purple-700 text-left";
                    btn.textContent = listName;
                    btn.onclick = () => addWordToList(listName, word, translation);
                    listsDiv.appendChild(btn);
                });
                document.getElementById('add-flashcard-status').textContent = '';
                document.getElementById('new-list-name').value = '';
            }

            // Add word to existing list
            function addWordToList(listName, german, english) {
                let customLists = JSON.parse(localStorage.getItem('customGermanLists')) || {};
                if (!customLists[listName]) customLists[listName] = [];
                const exists = customLists[listName].some(card => card.german === german && card.english === english);
                if (exists) {
                    document.getElementById('add-flashcard-status').textContent = "Already exists in this list.";
                    document.getElementById('add-flashcard-status').className = "mt-2 text-sm text-center text-yellow-600";
                    return;
                }
                customLists[listName].push({ german, english, mastered: false });
                localStorage.setItem('customGermanLists', JSON.stringify(customLists));
                document.getElementById('add-flashcard-status').textContent = `Added to "${listName}"!`;
                document.getElementById('add-flashcard-status').className = "mt-2 text-sm text-center text-green-600";
                setTimeout(() => { modal.classList.add('hidden'); }, 1200);
            }

            // Create new list and add word
            document.getElementById('create-new-list-btn').onclick = function () {
                const listName = document.getElementById('new-list-name').value.trim();
                if (!listName) {
                    document.getElementById('add-flashcard-status').textContent = "Enter a list name.";
                    document.getElementById('add-flashcard-status').className = "mt-2 text-sm text-center text-red-600";
                    return;
                }
                let customLists = JSON.parse(localStorage.getItem('customGermanLists')) || {};
                if (customLists[listName]) {
                    document.getElementById('add-flashcard-status').textContent = "List already exists. Choose it above.";
                    document.getElementById('add-flashcard-status').className = "mt-2 text-sm text-center text-yellow-600";
                    return;
                }
                customLists[listName] = [{ german: lastSelectedWord, english: lastSelectedTranslation, mastered: false }];
                localStorage.setItem('customGermanLists', JSON.stringify(customLists));
                document.getElementById('add-flashcard-status').textContent = `Created "${listName}" and added!`;
                document.getElementById('add-flashcard-status').className = "mt-2 text-sm text-center text-green-600";
                setTimeout(() => { modal.classList.add('hidden'); }, 1200);
            };

            // Close modal
            document.getElementById('close-add-to-flash-modal').onclick = function () {
                modal.classList.add('hidden');
            };

            // Button click: open modal with selected word
            addToFlashBtn.addEventListener('click', () => {
                const selected = getCurrentHighlightedWords();
                console.log("Selected words for flashcard:", selected);
                if (!selected || !selected.word || !selected.translation) {
                    setStatus("Highlight a word first!");
                    return;
                }
                console.log(`Adding word: ${selected.word} → ${selected.translation}`);
                lastSelectedWord = selected.word;
                lastSelectedTranslation = selected.translation;
                showAddToFlashModal(selected.word, selected.translation);
            });
        })();
    </script>

    <script>
        /* ==== Flashcards Tool Script ==== */
        (() => {
            document.addEventListener('DOMContentLoaded', function () {
                feather.replace();
                AOS.init();

                const flashTab = document.getElementById("tab-flash");
                const flashTool = document.getElementById("flashcard-tool");
                flashTab.addEventListener("click", () => {
                    const customLists = JSON.parse(localStorage.getItem('customGermanLists')) || {};
                    if (Object.keys(customLists).length > 0) {
                        // Re-render flashcards and custom list buttons
                        // let flashcards = [...customLists[Object.keys(customLists)[0]]];
                        // localStorage.setItem('germanFlashcards', JSON.stringify(flashcards));
                        console.log("Rendering flashcards and custom lists...");
                        renderCustomListButtons();
                        // renderFlashcards();
                    }
                    flashTool.classList.remove("hidden");
                    vocabTool.classList.add("hidden");
                    flashTab.classList.add("bg-indigo-700");
                    vocabTab.classList.remove("bg-blue-700");
                });

                let flashcards = JSON.parse(localStorage.getItem('germanFlashcards')) || [];
                let customLists = JSON.parse(localStorage.getItem('customGermanLists')) || {};
                let currentPage = 1;
                const cardsPerPage = 20;

                function saveFlashcards() {
                    localStorage.setItem('germanFlashcards', JSON.stringify(flashcards));
                    updateCurrentCustomList();
                }
                function updateProgress() {
                    const masteredCount = flashcards.filter(c => c.mastered).length;
                    const percentage = flashcards.length ? Math.round((masteredCount / flashcards.length) * 100) : 0;
                    document.getElementById('progress-bar').style.width = `${percentage}%`;
                    document.getElementById('progress-percentage').textContent = `${percentage}%`;
                }
                window.renderFlashcards = function () {
                    const container = document.getElementById('flashcards-container');
                    container.innerHTML = '';
                    const startIndex = (currentPage - 1) * cardsPerPage;
                    const endIndex = Math.min(startIndex + cardsPerPage, flashcards.length);
                    flashcards.slice(startIndex, endIndex).forEach((card, idx) => {
                        const actualIndex = startIndex + idx;
                        const flashcard = document.createElement('div');
                        flashcard.className = `flashcard ${card.mastered ? 'border-2 border-green-500' : ''}`;
                        flashcard.dataset.index = actualIndex;
                        flashcard.innerHTML = `
              <div class="flashcard-inner h-full">
                <div class="flashcard-front bg-white rounded-lg shadow-md p-3 flex flex-col items-center justify-center cursor-pointer h-full">
                  <h3 class="text-sm font-bold text-center text-indigo-700">${card.german}</h3>
                  <button class="speak-btn mt-1 p-1 bg-indigo-100 rounded-full hover:bg-indigo-200"><i data-feather="volume-2" class="text-indigo-700 w-3 h-3"></i></button>
                  <p class="text-xs text-gray-500 mt-1">Click to flip</p>
                  ${card.mastered ? '<i data-feather="check-circle" class="text-green-500 mt-1 w-3 h-3"></i>' : ''}
                </div>
                <div class="flashcard-back bg-indigo-100 rounded-lg shadow-md p-2 flex flex-col items-center justify-center cursor-pointer h-full">
                  <h3 class="text-xs font-semibold text-center text-gray-800">${card.english}</h3>
                  <div class="mt-1 flex space-x-1">
                    <button class="master-btn px-2 py-0.5 ${card.mastered ? 'bg-green-500' : 'bg-gray-500'} text-white rounded text-xs">
                      ${card.mastered ? 'Mastered' : 'Mark as Mastered'}
                    </button>
                  </div>
                </div>
              </div>`;
                        container.appendChild(flashcard);
                        flashcard.addEventListener('click', function (event) { if (!event.target.classList.contains('master-btn')) this.classList.toggle('flipped'); });
                    });
                    document.querySelectorAll('.master-btn').forEach(btn => {
                        btn.addEventListener('click', function (e) {
                            e.stopPropagation();
                            const idx = parseInt(this.closest('.flashcard').dataset.index);
                            flashcards[idx].mastered = !flashcards[idx].mastered;
                            saveFlashcards(); updateProgress(); renderFlashcards();
                        });
                    });
                    updatePaginationControls();
                    feather.replace();
                    updateProgress();
                }
                function shuffleArray(array) { const newArr = [...array]; for (let i = newArr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[newArr[i], newArr[j]] = [newArr[j], newArr[i]]; } return newArr; }
                function updatePaginationControls() {
                    const totalPages = Math.ceil(flashcards.length / cardsPerPage);
                    document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
                    const controls = document.getElementById('pagination-controls');
                    controls.classList.toggle('hidden', totalPages <= 1);
                    document.getElementById('prev-page-btn').disabled = currentPage === 1;
                    document.getElementById('next-page-btn').disabled = currentPage === totalPages;
                }
                function speakWord(text) { const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; speechSynthesis.speak(u); }
                function getCurrentListName() {
                    const cur = JSON.stringify(flashcards);
                    for (const [listName, listCards] of Object.entries(customLists)) {
                        if (JSON.stringify(listCards) === cur) return listName;
                    }
                    return null;
                }

                function updateCurrentCustomList() {
                    const listName = getCurrentListName();
                    if (listName && customLists[listName]) {
                        customLists[listName] = [...flashcards];
                        localStorage.setItem('customGermanLists', JSON.stringify(customLists));
                    }
                }

                function renderCustomListButtons() {

                    const container = document.getElementById('custom-lists-container');
                    customLists = JSON.parse(localStorage.getItem('customGermanLists')) || {};
                    container.innerHTML = '';
                    Object.keys(customLists).forEach(listName => {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'relative group';

                        const btn = document.createElement('button');
                        btn.className = 'px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 flex items-center';
                        btn.innerHTML = `<i data-feather="list" class="mr-2"></i> ${listName}`;
                        btn.addEventListener('click', () => {
                            flashcards = [...customLists[listName]];
                            saveFlashcards();
                            currentPage = 1;
                            renderFlashcards();
                        });

                        const removeBtn = document.createElement('button');
                        removeBtn.className = 'absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100';
                        removeBtn.innerHTML = '×';
                        removeBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (confirm(`Delete the "${listName}" list?`)) {
                                delete customLists[listName];
                                localStorage.setItem('customGermanLists', JSON.stringify(customLists));
                                renderCustomListButtons();
                                const listNames = Object.keys(customLists);
                                if (listNames.length > 0) {
                                    flashcards = [...customLists[listNames[0]]];
                                    saveFlashcards();
                                    renderFlashcards();
                                } else {
                                    flashcards = [];
                                    saveFlashcards();
                                    renderFlashcards();
                                }
                            }
                        });

                        wrapper.appendChild(btn);
                        wrapper.appendChild(removeBtn);
                        container.appendChild(wrapper);
                    });
                    feather.replace();
                }

                // Buttons
                document.getElementById('shuffle-btn').addEventListener('click', () => {
                    flashcards = shuffleArray(flashcards);
                    saveFlashcards();
                    renderFlashcards();
                });

                document.getElementById('reset-btn').addEventListener('click', () => {
                    if (confirm('Reset progress for this list?')) {
                        const listName = getCurrentListName();
                        if (listName && customLists[listName]) {
                            customLists[listName] = customLists[listName].map(c => ({ ...c, mastered: false }));
                            localStorage.setItem('customGermanLists', JSON.stringify(customLists));
                            flashcards = [...customLists[listName]];
                            saveFlashcards();
                            renderFlashcards();
                        }
                    }
                });

                document.getElementById('show-original-btn').addEventListener('click', () => {
                    const names = Object.keys(customLists);
                    if (names.length > 0) {
                        flashcards = [...customLists[names[0]]];
                        currentPage = 1;
                        renderFlashcards();
                    } else {
                        alert('No custom lists available.');
                    }
                });

                document.getElementById('show-not-mastered-btn').addEventListener('click', () => {
                    const listName = getCurrentListName();
                    if (listName && customLists[listName]) flashcards = [...customLists[listName]];
                    const notMastered = flashcards.filter(c => !c.mastered);
                    if (notMastered.length === 0) { alert('All words mastered!'); return; }
                    flashcards = notMastered;
                    currentPage = 1;
                    renderFlashcards();
                });

                document.addEventListener('click', e => {
                    if (e.target.closest('.speak-btn') || e.target.closest('.speak-btn i')) {
                        const card = e.target.closest('.flashcard');
                        const idx = card.dataset.index;
                        speakWord(flashcards[idx].german);
                    }
                });

                document.getElementById('next-page-btn').addEventListener('click', () => {
                    const totalPages = Math.ceil(flashcards.length / cardsPerPage);
                    if (currentPage < totalPages) { currentPage++; renderFlashcards(); }
                });
                document.getElementById('prev-page-btn').addEventListener('click', () => {
                    if (currentPage > 1) { currentPage--; renderFlashcards(); }
                });

                document.getElementById('add-flashcards-btn').addEventListener('click', () => {
                    const raw = document.getElementById('new-flashcards-input').value.trim();
                    const listName = document.getElementById('list-name-input').value.trim();
                    if (!raw || !listName) { alert('Please enter both list name and flashcards!'); return; }
                    const newCards = [];
                    raw.split('\n').forEach(line => {
                        const parts = line.split(/\s*(–|--|:|-|::)\s*/).filter((p, i) => i === 0 || (i % 2 === 1 ? false : true)).map(p => p.trim());
                        if (parts.length === 2 && parts[0] && parts[1]) {
                            newCards.push({ german: parts[0], english: parts[1], mastered: false });
                        }
                    });
                    if (newCards.length > 0) {
                        customLists[listName] = newCards;
                        localStorage.setItem('customGermanLists', JSON.stringify(customLists));
                        document.getElementById('new-flashcards-input').value = '';
                        document.getElementById('list-name-input').value = '';
                        flashcards = [...newCards];
                        saveFlashcards();
                        renderFlashcards();
                        renderCustomListButtons();
                        const notif = document.createElement('div');
                        notif.textContent = `Added ${newCards.length} flashcards to "${listName}"`;
                        notif.className = "fixed top-6 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-4 py-2 rounded shadow z-50";
                        document.body.appendChild(notif);
                        setTimeout(() => notif.remove(), 3500);
                    }
                });

                // Init
                const names = Object.keys(customLists);
                if (names.length > 0) flashcards = [...customLists[names[0]]];
                renderFlashcards();
                renderCustomListButtons();
                updatePaginationControls();
            });
        })();

        // Popup logic for Add Flashcards
        document.addEventListener('DOMContentLoaded', function () {
            const openBtn = document.getElementById('open-add-flashcards-modal');
            const modal = document.getElementById('add-flashcards-modal');
            const closeBtn = document.getElementById('close-add-flashcards-modal');
            openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); });
            closeBtn.addEventListener('click', () => { modal.classList.add('hidden'); });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.add('hidden');
            });
        });

    </script>
</body>
