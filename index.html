<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>German Vocabulary Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 4px;
            background: #1f2937;
            color: white;
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            white-space: normal;
            z-index: 50;
            pointer-events: none;
            max-width: 300px;
            word-wrap: break-word;
        }

        .highlighted {
            background-color: #fef08a;
            border-radius: 0.25rem;
            font-weight: bold;
            position: relative;
        }

        #selectionTooltip {
            position: absolute;
            background: #1f2937;
            color: white;
            font-size: 0.8rem;
            padding: 0.5rem;
            border-radius: 0.25rem;
            white-space: normal;
            z-index: 100;
            display: none;
            max-width: 300px;
            word-wrap: break-word;
            text-align: center;
        }

        #output {
            white-space: pre-wrap;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        .speaking {
            background-color: #bbf7d0 !important;
        }

        .loading {
            opacity: 0.7;
            position: relative;
        }

        .loading::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            margin: -8px 0 0 -8px;
            border: 2px solid #3b82f6;
            border-radius: 50%;
            border-right-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .selection-highlight {
            background-color: rgba(79, 70, 229, 0.2);
            position: absolute;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">
    <div class="w-full max-w-3xl">
        <h1 class="text-2xl font-bold mb-2 text-blue-800">German Vocabulary Tool</h1>
        <p class="text-gray-600 mb-4">Click on any German word to see its translation and hear pronunciation. Click
            again to remove highlight. Touch and hold or drag to select multiple words.</p>

        <div class="bg-white p-4 rounded-lg shadow-sm mb-6">
            <textarea id="input" placeholder="Guten Morgen! Wie geht es dir heute? Ich möchte nach Hause fahren."
                class="w-full h-40 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">Guten Morgen! Wie geht es dir heute? Ich möchte nach Hause fahren.</textarea>

            <div class="flex justify-between items-center mt-3">
                <button id="processBtn"
                    class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                            clip-rule="evenodd" />
                    </svg>
                    Process Text
                </button>

                <div class="flex items-center">
                    <button id="stopSpeechBtn"
                        class="px-3 py-1 bg-red-500 text-white rounded-lg text-sm mr-2 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20"
                            fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z"
                                clip-rule="evenodd" />
                        </svg>
                        Stop Speech
                    </button>

                    <div class="text-sm text-gray-600">
                        <span id="status">Ready</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="output" class="w-full p-6 bg-white border rounded-lg shadow-sm leading-8 min-h-[200px]"></div>

        <div id="selectionTooltip"></div>
    </div>

    <script>
        const input = document.getElementById("input");
        const output = document.getElementById("output");
        const processBtn = document.getElementById("processBtn");
        const stopSpeechBtn = document.getElementById("stopSpeechBtn");
        const selectionTooltip = document.getElementById("selectionTooltip");
        const statusEl = document.getElementById("status");

        let currentUtterance = null;
        let speechSynth = window.speechSynthesis;
        let isSelecting = false;
        let selectionStart = null;
        let selectionHighlight = null;

        function setStatus(message) {
            statusEl.textContent = message;
        }

        function tokenize(text) {
            return text.split(/(\s+|[^A-Za-zÄÖÜäöüß]+)/).filter(Boolean);
        }

        // translation function 
        async function translate(text) {
            try {
                const res = await fetch(
                    "https://api.mymemory.translated.net/get?q=" +
                    encodeURIComponent(text) +
                    "&langpair=de|en"
                );
                const data = await res.json();
                return data?.responseData?.translatedText || "(error)";
            } catch {
                return "(error)";
            }
        }

        function speak(text, lang = "de-DE") {
            // Cancel any ongoing speech
            if (currentUtterance) {
                speechSynth.cancel();
            }

            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = lang;

            // Store the current utterance
            currentUtterance = utter;

            // Update status
            setStatus("Speaking...");

            // Clear the reference when speech is done
            utter.onend = function () {
                if (currentUtterance === utter) {
                    currentUtterance = null;
                    setStatus("Ready");
                }
            };

            utter.onerror = function () {
                setStatus("Speech error");
            };

            speechSynth.speak(utter);
        }

        function stopSpeech() {
            if (speechSynth.speaking) {
                speechSynth.cancel();
                setStatus("Speech stopped");
                // Remove speaking highlights
                document.querySelectorAll('.speaking').forEach(el => {
                    el.classList.remove('speaking');
                });
            }
        }

        async function onWordClick(word, span) {
            const alreadyHighlighted = span.classList.contains("highlighted");

            if (alreadyHighlighted) {
                // Remove highlight and tooltip
                span.classList.remove("highlighted");
                const existingTooltip = span.querySelector(".tooltip");
                if (existingTooltip) {
                    existingTooltip.remove();
                }
                return;
            }

            // Add loading indicator
            span.classList.add('loading');

            // Speak the word
            speak(word, "de-DE");

            // Translate the word
            const translated = await translate(word);

            // Remove loading indicator
            span.classList.remove('loading');

            // Add highlight
            span.classList.add("highlighted");

            // Add tooltip above the word
            const tip = document.createElement("div");
            tip.className = "tooltip";
            tip.textContent = translated;
            span.appendChild(tip);
        }

        function getSelectedWords() {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.toString().trim().length < 2) return null;

            const range = selection.getRangeAt(0);
            const selectedText = selection.toString().trim();

            // Check if selection is within output
            if (!output.contains(range.startContainer) && !output.contains(range.endContainer)) {
                return null;
            }

            return {
                text: selectedText,
                range: range
            };
        }

        async function handleSelection() {
            const selection = getSelectedWords();
            if (!selection) {
                selectionTooltip.style.display = "none";
                if (selectionHighlight) {
                    selectionHighlight.remove();
                    selectionHighlight = null;
                }
                return;
            }

            const rect = selection.range.getBoundingClientRect();

            // Create or update selection highlight
            if (!selectionHighlight) {
                selectionHighlight = document.createElement('div');
                selectionHighlight.className = 'selection-highlight';
                document.body.appendChild(selectionHighlight);
            }

            selectionHighlight.style.width = rect.width + 'px';
            selectionHighlight.style.height = rect.height + 'px';
            selectionHighlight.style.left = (rect.left + window.scrollX) + 'px';
            selectionHighlight.style.top = (rect.top + window.scrollY) + 'px';

            // Speak the selection
            speak(selection.text, "de-DE");

            // Show loading in tooltip
            selectionTooltip.textContent = "Translating...";
            selectionTooltip.style.left = (rect.left + window.scrollX) + "px";
            selectionTooltip.style.top = (rect.top + window.scrollY - 10) + "px";
            selectionTooltip.style.display = "block";

            // Translate the selection
            const translated = await translate(selection.text);

            // Update tooltip with translation
            selectionTooltip.textContent = translated;

            // Position the tooltip above the selection
            selectionTooltip.style.left = (rect.left + window.scrollX) + "px";
            selectionTooltip.style.top = (rect.top + window.scrollY - selectionTooltip.offsetHeight - 10) + "px";

            // Auto-hide after 5 sec
            setTimeout(() => {
                selectionTooltip.style.display = "none";
                if (selectionHighlight) {
                    selectionHighlight.remove();
                    selectionHighlight = null;
                }
            }, 5000);
        }

        // Mobile-friendly selection handling
        function setupMobileSelection() {
            let touchStartX = 0;
            let touchStartY = 0;
            let touchMoved = false;

            output.addEventListener('touchstart', function (e) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchMoved = false;

                // Clear any previous selection after a short delay
                setTimeout(() => {
                    if (!touchMoved && window.getSelection().toString().trim() === '') {
                        selectionTooltip.style.display = 'none';
                        if (selectionHighlight) {
                            selectionHighlight.remove();
                            selectionHighlight = null;
                        }
                    }
                }, 50);
            }, { passive: true });

            output.addEventListener('touchmove', function (e) {
                touchMoved = true;
            }, { passive: true });

            output.addEventListener('touchend', function (e) {
                if (touchMoved) {
                    // Handle selection after a short delay to allow the selection to update
                    setTimeout(handleSelection, 100);
                }
            }, { passive: true });
        }

        processBtn.addEventListener("click", () => {
            output.innerHTML = "";
            const tokens = tokenize(input.value);

            tokens.forEach((tok) => {
                if (/^[A-Za-zÄÖÜäöüß]+$/.test(tok)) {
                    const span = document.createElement("span");
                    span.textContent = tok;
                    span.className = "relative cursor-pointer hover:bg-yellow-100 rounded px-1 mx-0.5";
                    span.addEventListener("click", () => onWordClick(tok, span));
                    output.appendChild(span);
                } else {
                    output.appendChild(document.createTextNode(tok));
                }
            });

            // Setup mobile selection after content is loaded
            setTimeout(setupMobileSelection, 100);

            setStatus("Text processed");
        });

        stopSpeechBtn.addEventListener("click", stopSpeech);

        // Listen for text selection on desktop
        document.addEventListener("mouseup", () => {
            setTimeout(handleSelection, 50);
        });

        // Initialize with some German text
        processBtn.click();
    </script>
</body>

</html>
